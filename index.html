<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Budjet Jamg'armasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Open Budjet Jamg'armasi</h1>
    <p class="subtitle">Yig'im jarayoni — maqsad: har bir yil uchun 3 000 000 so'm</p>

    <div class="total-box">
      <span class="total-label">Jami yig'ilgan</span>
      <span class="total-amount" id="total"></span>
    </div>

    <div id="bars"></div>

    <div class="legend">
      <span class="legend-item"><span class="dot full"></span> To'liq</span>
      <span class="legend-item"><span class="dot partial"></span> Qisman</span>
      <span class="legend-item"><span class="dot zero"></span> Yo'q</span>
      <span class="legend-item"><span class="dot new"></span> Yangi qo'shilgan</span>
    </div>
  </div>

  <script>
    fetch('data.json')
      .then(r => r.json())
      .then(db => {
        const TARGET = db.target;
        const years = db.years;

        let latestDate = null;
        for (const y of years) {
          for (const c of y.contributions) {
            if (!latestDate || c.date > latestDate) latestDate = c.date;
          }
        }

        const container = document.getElementById('bars');
        const total = years.reduce((s, y) =>
          s + y.contributions.reduce((a, c) => a + c.amount, 0), 0);
        document.getElementById('total').textContent =
          (total * 1000).toLocaleString('ru-RU') + ' so\'m' + '';

        years.forEach(y => {
          const amount = y.contributions.reduce((a, c) => a + c.amount, 0);
          const newlyAdded = latestDate
            ? y.contributions
                .filter(c => c.date === latestDate)
                .reduce((a, c) => a + c.amount, 0)
            : 0;
          const pct = Math.min(Math.round((amount / TARGET) * 100), 100);
          const actual = (amount * 1000).toLocaleString('ru-RU');

          const row = document.createElement('div');
          row.className = 'row' + (newlyAdded > 0 ? ' has-new' : '');

          let barClass = 'bar-fill';
          if (pct === 100) barClass += ' full';
          else if (pct === 0) barClass += ' zero';
          else if (pct < 50) barClass += ' low';

          const newTag = newlyAdded > 0
            ? `<span class="new-tag">+${(newlyAdded * 1000).toLocaleString('ru-RU')} so'm</span>`
            : '';

          row.innerHTML = `
            <span class="year">${y.year}</span>
            <div class="bar-track">
              <div class="${barClass}" style="width: ${pct}%"></div>
            </div>
            <span class="pct">${pct}%</span>
            <span class="new-cell">${newTag}</span>
            <span class="amount">${actual} so'm</span>
          `;
          container.appendChild(row);
        });
      });
  </script>
</body>
</html>
