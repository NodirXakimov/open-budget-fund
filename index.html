<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Budget Fund</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Open Budget Fund</h1>
    <p class="subtitle">Yearly collection progress — target: 3,000,000 UZS per year</p>
    <div class="total-box">
      <span class="total-label">Total collected</span>
      <span class="total-amount" id="total"></span>
    </div>
    <div id="bars"></div>
    <div class="legend">
      <span class="legend-item"><span class="dot full"></span> 100%</span>
      <span class="legend-item"><span class="dot partial"></span> Partial</span>
      <span class="legend-item"><span class="dot zero"></span> 0%</span>
    </div>
  </div>
  <script>
    const TARGET = 3000;

    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('bars');
        const total = data.reduce((sum, item) => sum + item.amount, 0);
        document.getElementById('total').textContent = (total * 1000).toLocaleString() + ' UZS';

        data.forEach(item => {
          const pct = Math.min(Math.round((item.amount / TARGET) * 100), 100);
          const actual = (item.amount * 1000).toLocaleString();

          const row = document.createElement('div');
          row.className = 'row';

          let barClass = 'bar-fill';
          if (pct === 100) barClass += ' full';
          else if (pct === 0) barClass += ' zero';
          else if (pct < 50) barClass += ' low';

          row.innerHTML = `
            <span class="year">${item.year}</span>
            <div class="bar-track">
              <div class="${barClass}" style="width: ${pct}%"></div>
            </div>
            <span class="pct">${pct}%</span>
            <span class="amount">${actual} UZS</span>
          `;
          container.appendChild(row);
        });
      });
  </script>
</body>
</html>
